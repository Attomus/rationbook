included:
  - Sources

excluded:
  - .build
  - build
  - DerivedData
  - dist

only_rules:
  - closing_brace
  - closure_end_indentation
  - colon
  - comma
  - control_statement
  - duplicate_imports
  - empty_enum_arguments
  - empty_parameters
  - empty_parentheses_with_trailing_closure
  - leading_whitespace
  - legacy_constructor
  - opening_brace
  - operator_usage_whitespace
  - protocol_property_accessors_order
  - return_arrow_whitespace
  - syntactic_sugar
  - trailing_newline
  - trailing_semicolon
  - trailing_whitespace
  - unneeded_break_in_switch
  - unused_closure_parameter
  - unused_control_flow_label
  - vertical_whitespace
  - void_return

reporter: xcode
